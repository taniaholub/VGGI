<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>ControlTask</title>
    <style>
        body {
            background-color: #EEEEEE;
        }

        .controls label {
            display: inline-block;
            min-width: 140px;
        }
    </style>

    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./shader.gpu"></script>
    <script src="./main.js"></script>
    <script src="./Model.js"></script>
    <script src="./TextureHandler.js"></script>
</head>

<body onload="init()">

    <h2>Sievert's Surface: textures, normal mapping, rotating light</h2>

    <p id="message">Drag your mouse on the surface to rotate it.<br>
        (On a touch screen, you can use your finger.)</p>

    <div class="controls">
        <div>
            <label for="sliderU">Granularity U: <b id="valU">60</b></label>
            <input type="range" id="sliderU" min="4" max="120" step="1" value="60">
        </div>
        <div>
            <label for="sliderV">Granularity V: <b id="valV">60</b></label>
            <input type="range" id="sliderV" min="4" max="120" step="1" value="60">
        </div>
    </div>

    <div id="canvas-holder">
        <canvas id="webglcanvas"></canvas>
    </div>

</body>

</html>
